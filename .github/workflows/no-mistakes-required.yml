name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
            # The structured attestation comment is the preferred evidence, but
            # not every no-mistakes release writes one: an existing PR body
            # updated by no-mistakes v1.57.0 carries the pipeline section without
            # it. When the comment is absent, read the same three step outcomes
            # from the rendered "## Pipeline" summaries the pipeline always
            # writes, so a skipped step is still caught without failing every PR.
            prefix='<!-- no-mistakes-pipeline-attestation:v1 '
            suffix=' -->'
            body="${PR_BODY:-}"
            json=''
            attested=0
            incomplete=''
            case "$body" in
              *"$prefix"*)
                attested=1
                ;;
            esac
            if [ "$attested" -eq 1 ]; then
              if ! command -v jq >/dev/null 2>&1; then
                echo "::error::This check requires jq to parse no-mistakes pipeline step attestation, but jq was not found on the runner." >&2
                exit 1
              fi
              parse_ok=0
              rest="${body#*"$prefix"}"
              case "$rest" in
                *"$suffix"*)
                  json="${rest%%"$suffix"*}"
                  if printf '%s' "$json" | jq -e . >/dev/null 2>&1; then
                    parse_ok=1
                  fi
                  ;;
              esac
              if [ "$parse_ok" -ne 1 ]; then
                {
                  echo "::error::The no-mistakes pipeline step attestation in the PR body is unparseable."
                  echo
                  echo "The body carries the attestation marker, but the JSON between"
                  echo
                  echo '    <!-- no-mistakes-pipeline-attestation:v1 {"head_sha":"...","steps":[...]} -->'
                  echo
                  echo "is missing its closing marker or is not valid JSON."
                  echo "Re-run the pipeline with 'git push no-mistakes' so it rewrites the body."
                  echo "See CONTRIBUTING.md for setup and the full workflow."
                  echo
                  echo "PR author: ${PR_AUTHOR}"
                } >&2
                exit 1
              fi
              evidence='structured pipeline step attestation'
              for required in review test document; do
                status=$(printf '%s' "$json" | jq -r --arg step "$required" \
                  '([(.steps | arrays | .[]) | select(.step == $step) | .status] | first // empty | select(. != "")) // "missing"')
                if [ "$status" != "completed" ]; then
                  if [ -n "$incomplete" ]; then
                    incomplete="${incomplete}, "
                  fi
                  incomplete="${incomplete}${required}=${status}"
                fi
              done
            else
              evidence='rendered pipeline step summaries'
              for required in review test document; do
                line=$(printf '%s\n' "$body" \
                  | awk -v m="$marker" 'index($0, m) > 0 { seen = 1 } seen' \
                  | grep -i -m1 -e "\*\*${required}\*\* -" || true)
                status=$(printf '%s\n' "$line" \
                  | sed -e 's/.*\*\* -[[:space:]]*//' -e 's/<.*//' -e 's/[[:space:]]*$//' \
                  | tr '[:upper:]' '[:lower:]')
                if [ -z "$status" ]; then
                  status='missing'
                fi
                # Deny-list rather than allow-list: a completed step renders its
                # findings ("1 info", "2 warnings"), which cannot be enumerated,
                # while every not-completed outcome has a fixed rendering.
                case "$status" in
                  missing|skipped|pending|running|auto-fixing|failed|\
                  'review fix'|'awaiting approval'|'findings unavailable'|'status unavailable')
                    if [ -n "$incomplete" ]; then
                      incomplete="${incomplete}, "
                    fi
                    incomplete="${incomplete}${required}=${status}"
                    ;;
                esac
              done
            fi
            if [ -n "$incomplete" ]; then
              {
                echo "::error::Required no-mistakes pipeline steps are not completed: ${incomplete}."
                echo
                echo "This repository requires the review, test, and document steps to each"
                echo "complete. Quota skips and agent skips are not compliant."
                echo "Statuses were read from the ${evidence} in the PR body."
                echo
                echo "Re-run the pipeline with 'git push no-mistakes' so those required steps"
                echo "complete rather than skip."
                echo "See CONTRIBUTING.md for setup and the full workflow."
                echo
                echo "PR author: ${PR_AUTHOR}"
              } >&2
              exit 1
            fi
            echo "Pipeline steps verified from the ${evidence}: review, test, and document completed."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
            echo "That pipeline runs the required review/test/lint/CI steps and writes a"
            echo "deterministic '## Pipeline' section into the PR body containing:"
            echo
            echo "    $marker"
            echo
            echo "See CONTRIBUTING.md for setup and the full workflow."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
